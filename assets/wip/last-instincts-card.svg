<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
  <title id="t">Last Instincts — key art placeholder</title>
  <desc id="d">A cross-section of a bunker dug three rooms deep under a snowfield at dusk, lift shaft to the surface, snow falling. Pixel-style placeholder drawn for the portfolio while the Unity rebuild is in development.</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a38"/>
      <stop offset=".75" stop-color="#3f5468"/>
      <stop offset="1" stop-color="#5c7286"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="6" height="6" fill="#201c18"/>
      <rect x="16" y="14" width="6" height="6" fill="#201c18"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="900" height="600" fill="url(#dusk)"/>

  <!-- far hills -->
  <g fill="#2e3f52">
    <rect x="0" y="208" width="900" height="40"/>
    <rect x="60" y="190" width="120" height="18"/>
    <rect x="100" y="178" width="48" height="12"/>
    <rect x="300" y="196" width="180" height="12"/>
    <rect x="700" y="186" width="140" height="22"/>
    <rect x="740" y="174" width="60" height="12"/>
  </g>

  <!-- snow -->
  <rect x="0" y="244" width="900" height="36" fill="#e4eaee"/>
  <rect x="0" y="244" width="900" height="6" fill="#f6f8fa"/>
  <g fill="#c9d3da">
    <rect x="120" y="268" width="60" height="6"/>
    <rect x="520" y="262" width="90" height="6"/>
    <rect x="760" y="270" width="40" height="6"/>
  </g>

  <!-- a dead tree -->
  <g fill="#141a22">
    <rect x="786" y="166" width="10" height="78"/>
    <rect x="766" y="186" width="24" height="8"/>
    <rect x="794" y="176" width="26" height="8"/>
    <rect x="760" y="178" width="8" height="10"/>
    <rect x="816" y="166" width="8" height="12"/>
  </g>

  <!-- earth -->
  <rect x="0" y="280" width="900" height="320" fill="url(#earth)"/>
  <rect x="0" y="280" width="900" height="320" fill="url(#grain)" opacity=".7"/>

  <!-- hatch and lift shaft -->
  <rect x="402" y="226" width="60" height="18" fill="#5b6672"/>
  <rect x="408" y="218" width="48" height="8" fill="#7d8894"/>
  <rect x="412" y="244" width="40" height="326" fill="#0c0f12"/>
  <g fill="#3b4652">
    <rect x="412" y="300" width="40" height="4"/>
    <rect x="412" y="400" width="40" height="4"/>
    <rect x="412" y="500" width="40" height="4"/>
  </g>
  <!-- the lift car -->
  <rect x="418" y="412" width="28" height="36" fill="#8d6a3a"/>
  <rect x="422" y="418" width="20" height="10" fill="#e8c372"/>

  <!-- three rooms, each lit; the deepest one still being dug -->
  <g>
    <rect x="452" y="300" width="248" height="76" fill="#3a3129"/>
    <rect x="458" y="306" width="236" height="64" fill="#5a4a36"/>
    <rect x="458" y="306" width="236" height="64" fill="#f0c56a" opacity=".18"/>
    <rect x="470" y="340" width="22" height="30" fill="#2a221a"/>
    <rect x="520" y="352" width="60" height="18" fill="#2a221a"/>
    <rect x="640" y="312" width="36" height="22" fill="#9ec0d6"/>
  </g>
  <g>
    <rect x="452" y="400" width="248" height="76" fill="#3a3129"/>
    <rect x="458" y="406" width="236" height="64" fill="#5a4a36"/>
    <rect x="458" y="406" width="236" height="64" fill="#f0c56a" opacity=".14"/>
    <rect x="480" y="440" width="18" height="30" fill="#2a221a"/>
    <rect x="510" y="440" width="18" height="30" fill="#2a221a"/>
    <rect x="600" y="420" width="70" height="50" fill="#2a221a"/>
    <rect x="606" y="426" width="58" height="12" fill="#c75b4a"/>
  </g>
  <g>
    <rect x="452" y="500" width="150" height="70" fill="#231d18"/>
    <rect x="602" y="500" width="98" height="70" fill="#1a1612"/>
    <rect x="602" y="500" width="98" height="70" fill="url(#grain)"/>
    <rect x="458" y="506" width="138" height="58" fill="#3a2f26"/>
    <rect x="458" y="506" width="138" height="58" fill="#f0c56a" opacity=".08"/>
    <rect x="560" y="530" width="30" height="34" fill="#2a221a"/>
    <rect x="606" y="520" width="12" height="40" fill="#6b5a46"/>
    <rect x="612" y="512" width="22" height="10" fill="#9aa3ab"/>
  </g>
  <!-- left wing: the first room, where it started -->
  <rect x="200" y="300" width="212" height="76" fill="#3a3129"/>
  <rect x="206" y="306" width="200" height="64" fill="#5a4a36"/>
  <rect x="206" y="306" width="200" height="64" fill="#f0c56a" opacity=".12"/>
  <rect x="230" y="326" width="40" height="44" fill="#2a221a"/>
  <rect x="300" y="350" width="80" height="20" fill="#2a221a"/>
  <rect x="236" y="332" width="28" height="8" fill="#e8c372"/>

  <!-- snowfall -->
  <g fill="#f6f8fa" opacity=".85">
    <rect x="72" y="60" width="6" height="6"/><rect x="190" y="118" width="6" height="6"/>
    <rect x="254" y="44" width="6" height="6"/><rect x="330" y="150" width="6" height="6"/>
    <rect x="470" y="92" width="6" height="6"/><rect x="548" y="166" width="6" height="6"/>
    <rect x="620" y="54" width="6" height="6"/><rect x="690" y="128" width="6" height="6"/>
    <rect x="152" y="196" width="6" height="6"/><rect x="836" y="88" width="6" height="6"/>
    <rect x="400" y="30" width="6" height="6"/><rect x="760" y="36" width="6" height="6"/>
  </g>

  <!-- inset frame -->
  <rect x="22" y="22" width="856" height="556" fill="none" stroke="#e4eaee" stroke-opacity=".26" stroke-width="2"/>

  <!-- title -->
  <g font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" fill="#f6f8fa">
    <text x="56" y="92" font-size="44" font-weight="700" letter-spacing="6">LAST INSTINCTS</text>
    <text x="58" y="124" font-size="18" letter-spacing="1" fill="#c9d3da">Build the bunker. Claim the land. Survive the winters.</text>
  </g>
  <text x="844" y="536" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" text-anchor="end" fill="#e4eaee" opacity=".8">IN DEVELOPMENT</text>
</svg>
